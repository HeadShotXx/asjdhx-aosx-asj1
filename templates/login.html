{% extends "base.html" %}
{% block title %}Login — DragonST{% endblock %}
{% block head %}
<style>
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 80px 1.5rem 2rem;
  }
  .auth-box { width: 100%; max-width: 400px; }
  .auth-box .logo {
    font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700;
    margin-bottom: 2.5rem; letter-spacing: -.02em;
  }
  .auth-box .logo span { color: var(--red2); }
  .auth-box h1 { font-size: 1.5rem; font-weight: 600; color: var(--white); margin-bottom: .5rem; }
  .auth-box .sub { font-size: .875rem; color: var(--muted); margin-bottom: 2rem; }
  .field { margin-bottom: 1.25rem; }
  .field label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: .5rem; text-transform: uppercase; letter-spacing: .06em; }
  .field input {
    width: 100%; padding: .75rem 1rem;
    background: var(--card); border: 1px solid var(--border);
    color: var(--white); font-size: .9rem; font-family: inherit;
    outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--red); }
  .auth-submit {
    width: 100%; padding: .85rem;
    background: var(--red); color: #fff;
    border: none; font-size: .95rem; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: background .2s;
    margin-top: .5rem;
  }
  .auth-submit:hover { background: var(--red2); }
  .auth-link { margin-top: 1.5rem; font-size: .85rem; color: var(--muted); text-align: center; }
  .auth-link a { color: var(--red2); }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="logo">DRAGON<span>ST</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to access your dashboard.</p>
    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit">Sign In</button>
    </form>
    <p class="auth-link">No account? <a href="/register">Create one</a></p>
  </div>
</div>
{% endblock %}
